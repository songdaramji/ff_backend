spring:
  application:
    name: FestiFriends
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
    open-in-view: false
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}

springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
  api-docs:
    groups:
      enabled: true

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    admin-key: ${KAKAO_ADMIN_KEY}
    dev:
      redirect-uri: ${KAKAO_DEV_REDIRECT_URI}

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
    expiration: 3600000 # 1시간
  refresh:
    secret: ${JWT_REFRESH_SECRET}
    expiration: 604800000 # 1주일

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  performance-import:
    enabled: ${PERFORMANCE_IMPORT_ENABLED:false}
    year: ${PERFORMANCE_IMPORT_YEAR:2026}
    cron: ${PERFORMANCE_IMPORT_CRON:0 30 3 * * *}
    kopis-service-key: ${KOPIS_SERVICE_KEY:}
    keyword: ${KOPIS_IMPORT_KEYWORD:페스티벌}
    genre: ${KOPIS_IMPORT_GENRE:대중음악}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3311/ff
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
